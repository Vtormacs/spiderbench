server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão (o jogo tem muitos JS, JSON e modelos)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/octet-stream model/gltf-binary model/gltf+json image/svg+xml;

    # index.html sempre atualizado
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Assets com cache de 7 dias
    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
